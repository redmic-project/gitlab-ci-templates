.dind-env:
  stage: build
  variables:
    DIND_IMAGE_NAME: docker
    DIND_IMAGE_TAG: dind
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_CERT_PATH: /certs/client
    DOCKER_TLS_VERIFY: 1
    DOCKER_DRIVER: overlay2
  services:
    - ${DIND_IMAGE_NAME}:${DIND_IMAGE_TAG}

# Common configuration in relation to the repository events that trigger Docker jobs.

.docker-branch:
  rules:
    - if: $CI_MERGE_REQUEST_ID ||
          $CI_COMMIT_TAG ||
          $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH

.docker-tag:
  rules:
    - if: $CI_COMMIT_TAG &&
          $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+.*/i
