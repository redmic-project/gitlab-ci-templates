include:
  - local: '/build/docker/_docker.yml'

.docker-build:
  extends: .dind-env
  image: ${DOCKER_BUILD_IMAGE_NAME}:${DOCKER_BUILD_IMAGE_TAG}
  variables:
    DOCKER_BUILD_IMAGE_NAME: pedroetb/docker-build
    DOCKER_BUILD_IMAGE_TAG: latest
    PACKAGED_IMAGE_NAME: ${CI_REGISTRY_IMAGE}
    REGISTRY_URL: ${CI_REGISTRY}
    REGISTRY_USER: gitlab-ci-token
    REGISTRY_PASS: ${CI_JOB_TOKEN}
    COMPOSE_FILE_NAME_ENV: compose.tmpl.yaml:compose.pre.yaml
    COMPOSE_FILE_NAME_SINGLE: compose.yaml
  before_script:
    - echo "Find Compose files with known names at known paths automatically .."
    - >
      if [ -z "${COMPOSE_FILE_NAME}" ];
      then
        firstComposeFileName=$(echo "${COMPOSE_FILE_NAME_ENV}" | cut -d ':' -f 1);
        for directory in ${COMPOSE_PROJECT_DIRECTORY:-build .};
        do
          firstComposeFilePath=$(find "./${directory}" -type f -name "${firstComposeFileName}" | head -1);
          singleComposeFilePath=$(find "./${directory}" -type f -name "${COMPOSE_FILE_NAME_SINGLE}" | head -1);
          if [ -f "${firstComposeFilePath}" ];
          then
            echo "Detected '${firstComposeFilePath}' compose file, nice!";
            composeFileName="${COMPOSE_FILE_NAME_ENV}";
            composeProjectDirectory=$(dirname "${firstComposeFilePath}");
          elif [ -f "${singleComposeFilePath}" ];
          then
            echo "Detected '${singleComposeFilePath}' compose file, nice!";
            composeFileName="${COMPOSE_FILE_NAME_SINGLE}";
            composeProjectDirectory=$(dirname "${singleComposeFilePath}");
          else
            echo "No compose file detected at '${directory}/'";
          fi;
          if [ ! -z "${composeFileName}" ];
          then
            echo "Automatically set COMPOSE_FILE_NAME to '${composeFileName}' and COMPOSE_PROJECT_DIRECTORY to '${composeProjectDirectory}'";
            export COMPOSE_FILE_NAME="${composeFileName}";
            export COMPOSE_PROJECT_DIRECTORY="${composeProjectDirectory}";
            break;
          fi;
        done;
        if [ -z "${COMPOSE_FILE_NAME}" ];
        then
          echo "No compose file specified or detected, using docker-build default for COMPOSE_FILE_NAME and COMPOSE_PROJECT_DIRECTORY";
        fi;
      else
        echo "COMPOSE_FILE_NAME is defined, omitting automatic lookup";
      fi;
  script: build
