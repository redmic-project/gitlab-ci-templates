include:
  - local: '/deploy/service/_service.yml'

.docker-deploy:
  extends: .deploy
  image: ${DOCKER_DEPLOY_IMAGE_NAME}:${DOCKER_DEPLOY_IMAGE_TAG}
  variables:
    DOCKER_DEPLOY_IMAGE_NAME: redmic/docker-docker-deploy
    DOCKER_DEPLOY_IMAGE_TAG: latest
    STACK: ${CI_PROJECT_NAME}
    REGISTRY_URL: ${CI_REGISTRY}
    REGISTRY_USER: ${CI_DEPLOY_USER}
    REGISTRY_PASS: ${CI_DEPLOY_PASSWORD}
    DOCKERFILE_NAME: Dockerfile
    COMPOSE_FILE_SINGLE: compose.yaml
  before_script:
    - >
      echo "Find Compose files with known names automatically ..";
      if [ -z "${COMPOSE_FILE}" ];
      then
        firstComposeFileName=$(echo "${COMPOSE_FILE_ENV}" | cut -d ':' -f 1);
        for directory in ${DEPLOY_DIR_NAME:-deploy docker .};
        do
          if [ ! -d "${directory}" ];
          then
            continue;
          fi;
          firstComposeFilePath=$(find "./${directory}" -type f -name "${firstComposeFileName}" -print -quit);
          singleComposeFilePath=$(find "./${directory}" -type f -name "${COMPOSE_FILE_SINGLE}" -print -quit);
          if [ -f "${firstComposeFilePath}" ];
          then
            echo "Detected '${firstComposeFilePath}' compose file, nice!";
            composeFile="${COMPOSE_FILE_ENV}";
            deployDirName=$(dirname "${firstComposeFilePath}");
          elif [ -f "${singleComposeFilePath}" ];
          then
            echo "Detected '${singleComposeFilePath}' compose file, nice!";
            composeFile="${COMPOSE_FILE_SINGLE}";
            deployDirName=$(dirname "${singleComposeFilePath}");
          else
            echo "No compose file detected at '${directory}/'";
          fi;
          if [ ! -z "${composeFile}" ];
          then
            echo "Automatically set COMPOSE_FILE to '${composeFile}' and DEPLOY_DIR_NAME to '${deployDirName}'";
            export COMPOSE_FILE="${composeFile}";
            export DEPLOY_DIR_NAME="${deployDirName}";
            break;
          fi;
        done;
        if [ -z "${COMPOSE_FILE}" ];
        then
          echo "No compose file specified or detected, using docker-deploy default for COMPOSE_FILE and DEPLOY_DIR_NAME";
        fi;
      else
        echo "COMPOSE_FILE is defined, omitting automatic lookup";
      fi;
    - >
      echo "Find Dockerfile in depth by file name to automatically enable custom image usage ..";
      dockerfilePath=$(find -type f -name "${DOCKERFILE_NAME}" -print -quit);
      if [ -f "${dockerfilePath}" ];
      then
        echo "Detected '${dockerfilePath}' Dockerfile, setting up custom image variables (IMAGE_NAME and IMAGE_TAG) ..";
        if [ -z "${DD_IMAGE_NAME}" ];
        then
          echo "Automatically set DD_IMAGE_NAME to '${CI_REGISTRY_IMAGE}'";
          export DD_IMAGE_NAME="${CI_REGISTRY_IMAGE}";
        else
          echo "DD_IMAGE_NAME is already defined, omitting automatic custom DD_IMAGE_NAME setup!";
        fi;
        if [ -z "${DD_IMAGE_TAG}" ];
        then
          if [ -z "${CI_COMMIT_TAG}" ];
          then
            echo "Automatically set DD_IMAGE_TAG to '${CI_COMMIT_SHORT_SHA}'";
            export DD_IMAGE_TAG="${CI_COMMIT_SHORT_SHA}";
          else
            echo "Automatically set DD_IMAGE_TAG to '${CI_COMMIT_TAG}'";
            export DD_IMAGE_TAG="${CI_COMMIT_TAG}";
          fi;
        else
          echo "DD_IMAGE_TAG is already defined, omitting automatic custom DD_IMAGE_TAG setup!";
        fi;
      else
        echo "Unable to find any Dockerfile with name '${DOCKERFILE_NAME}', assuming external Docker image usage!";
      fi;
    - >
      if [ -d "${CI_PROJECT_DIR}.tmp" ];
      then
        deployTarget=${DEPLOY_DIR_NAME:-./deploy}/
        echo "Detected 'file' type variables, copying them into '${deployTarget}'";
        cp -r "${CI_PROJECT_DIR}.tmp/." "${deployTarget}";
      fi;
  script: deploy

.deploy-development:
  variables:
    DEPLOY_ENVIRONMENT_NAME: dev
    SSH_REMOTE: ${DEV_SSH_REMOTE}
    SSH_PORT: ${DEV_SSH_PORT}
    DEPLOY_KEY: ${DEV_DEPLOY_KEY}
    COMPOSE_FILE_ENV: compose.tmpl.yaml:compose.dev.yaml
    PUBLIC_HOSTNAME: ${DEV_PUBLIC_HOSTNAME}
    DD_PUBLIC_HOSTNAME: ${DEV_PUBLIC_HOSTNAME}
    DD_VOL_ADDR: ${DEV_VOL_ADDR}
    DD_VOL_DEVICE_PREFIX: ${DEV_VOL_DEVICE_PREFIX}

.deploy-production:
  variables:
    DEPLOY_ENVIRONMENT_NAME: pro
    SSH_REMOTE: ${PRO_SSH_REMOTE}
    SSH_PORT: ${PRO_SSH_PORT}
    DEPLOY_KEY: ${PRO_DEPLOY_KEY}
    COMPOSE_FILE_ENV: compose.tmpl.yaml:compose.prod.yaml
    PUBLIC_HOSTNAME: ${PRO_PUBLIC_HOSTNAME}
    DD_PUBLIC_HOSTNAME: ${PRO_PUBLIC_HOSTNAME}
    DD_VOL_ADDR: ${PRO_VOL_ADDR}
    DD_VOL_DEVICE_PREFIX: ${PRO_VOL_DEVICE_PREFIX}
