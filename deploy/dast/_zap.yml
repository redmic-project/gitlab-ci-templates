include:
  - local: '/deploy/dast/_dast.yml'

.dast-zap:
  extends: .dast
  image: ${ZAP_IMAGE_NAME}:${ZAP_IMAGE_TAG}
  variables:
    ZAP_IMAGE_NAME: zaproxy/zap-stable
    ZAP_IMAGE_TAG: latest
    ZAP_CONFIG_FILE: .zap/zap.yaml
    ZAP_REPORT_DIR: zap-reports
    DAST_TARGET_URL: ""
  before_script:
    - echo "Resolving ZAP Automation Framework configuration .."
    - |
      if [ -f "${ZAP_CONFIG_FILE}" ]; then
        echo "Project ZAP config found at '${ZAP_CONFIG_FILE}', using it"
        ZAP_ACTIVE_CONFIG="${ZAP_CONFIG_FILE}"
      else
        echo "No project ZAP config at '${ZAP_CONFIG_FILE}', falling back to default"
        ZAP_ACTIVE_CONFIG="/tmp/zap-default.yaml"
        cat > "${ZAP_ACTIVE_CONFIG}" << 'DEFAULTCONFIG'
      ---
      env:
        contexts:
          - name: "Default Context"
            urls:
              - "${DAST_TARGET_URL}"
            includePaths:
              - "${DAST_TARGET_URL}.*"
        parameters:
          failOnError: true
          failOnWarning: false
          progressToStdout: true
      jobs:
        - type: spider
          parameters:
            context: "Default Context"
            maxDuration: 5
            maxDepth: 5
            maxChildren: 10
        - type: spiderAjax
          parameters:
            context: "Default Context"
            maxDuration: 5
            maxCrawlDepth: 5
            numberOfBrowsers: 2
        - type: passiveScan-wait
          parameters:
            maxDuration: 10
        - type: report
          parameters:
            template: "traditional-html-plus"
            reportDir: "${CI_PROJECT_DIR}/zap-reports"
            reportFile: "zap-report"
            reportTitle: "ZAP DAST Report"
            reportDescription: "Automated DAST scan report"
          risks:
            - high
            - medium
            - low
            - info
        - type: report
          parameters:
            template: "traditional-json-plus"
            reportDir: "${CI_PROJECT_DIR}/zap-reports"
            reportFile: "zap-report"
            reportTitle: "ZAP DAST Report"
            reportDescription: "Automated DAST scan report"
          risks:
            - high
            - medium
            - low
            - info
      DEFAULTCONFIG
      fi
    - echo "Setting target URL to '${DAST_TARGET_URL}' .."
    - sed -e "s|\${DAST_TARGET_URL}|${DAST_TARGET_URL}|g" -e "s|\${CI_PROJECT_DIR}|${CI_PROJECT_DIR}|g" "${ZAP_ACTIVE_CONFIG}" > /tmp/zap-resolved.yaml
    - ZAP_ACTIVE_CONFIG="/tmp/zap-resolved.yaml"
    - mkdir -p "${ZAP_REPORT_DIR}"
  script:
    - zap.sh -cmd -autorun "${ZAP_ACTIVE_CONFIG}"
  artifacts:
    name: dast_zap_${CI_JOB_NAME}_${CI_COMMIT_REF_NAME}
    expire_in: 1 month
    when: always
    paths:
      - ${ZAP_REPORT_DIR}/
