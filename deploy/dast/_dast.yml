.dast:
  stage: deploy
  dependencies: []
  when: manual
  allow_failure: true

# Common configuration in relation to the repository events that trigger DAST jobs.

.dast-branch-rules:
  rules:
    - if: $CI_MERGE_REQUEST_ID ||
          $CI_COMMIT_TAG ||
          $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH

.dast-tag-rules:
  rules:
    - if: $CI_COMMIT_TAG

.dast-schedule-rules:
  rules:
    - if: $DAST_SCHEDULE_DISABLED
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_success
